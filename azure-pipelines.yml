# Uploads a server's CA chain to Azure Key Vault. Nothing is committed:
# the certificates are downloaded fresh on every run.

trigger: none
schedules:
  - cron: "0 6 * * 1"            # every Monday, catches certificate changes
    branches: { include: [main] }
    always: true

pool:
  name: my-selfhosted-pool       # Linux agent that can reach the host

variables:
  certHost: sub.mydomain.com
  vaultName: my-kv
  secretName: internal-ca-bundle

steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: my-service-connection   # needs Key Vault Secrets Officer
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        # 1. Get the server's certificate
        openssl s_client -connect "$CERTHOST:443" -servername "$CERTHOST" </dev/null 2>/dev/null | openssl x509 -out leaf.pem
        cp leaf.pem cert.pem; : > ca-bundle.pem

        # 2. Follow each certificate's "CA Issuers" link until reaching the root (it signs itself)
        while [ "$(openssl x509 -in cert.pem -noout -subject_hash)" != "$(openssl x509 -in cert.pem -noout -issuer_hash)" ]; do
          url=$(openssl x509 -in cert.pem -noout -text | grep -o 'CA Issuers - URI:.*' | cut -d: -f2-)
          curl -fsSL "$url" | openssl x509 -inform DER -out cert.pem
          cat cert.pem >> ca-bundle.pem
        done

        # 3. Check the bundle, then upload it
        openssl verify -CAfile ca-bundle.pem leaf.pem
        az keyvault secret set --vault-name "$VAULTNAME" --name "$SECRETNAME" --file ca-bundle.pem --output none
