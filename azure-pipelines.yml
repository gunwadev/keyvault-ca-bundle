# For each env and location: logs in to Azure, puts each server's CA chain in that Key Vault, then lists the vault. Run it manually.

trigger: none                    # manual runs only, no schedule

parameters:
  - name: envs
    type: object
    default: [prod]
  - name: locations
    type: object
    default: [east, west]

pool:
  vmImage: ubuntu-latest

variables:
  certHosts: sub.mydomain.com api.mydomain.com   # space-separated
  vaultPrefix: my-kv                             # vault name: <vaultPrefix>-<env>-<location>, e.g. my-kv-prod-east

jobs:
  - ${{ each env in parameters.envs }}:
    - ${{ each loc in parameters.locations }}:
      - job: ${{ env }}_${{ loc }}
        displayName: ${{ env }} ${{ loc }}
        variables:
          vaultName: ${{ variables.vaultPrefix }}-${{ env }}-${{ loc }}
        steps:
          - task: AzureCLI@2
            displayName: Azure login
            inputs:
              azureSubscription: my-service-connection   # needs Key Vault Secrets Officer on each vault
              scriptType: bash
              scriptLocation: inlineScript
              visibleAzLogin: false
              addSpnToEnvironment: true      # gives this script the service connection's login token
              inlineScript: |
                # This task logs out when it ends, so log in again into a folder the next steps can use
                export AZURE_CONFIG_DIR="$AGENT_TEMPDIRECTORY/azcli"
                az login --service-principal -u "$servicePrincipalId" --tenant "$tenantId" --federated-token "$idToken" --output none
                az account get-access-token --resource https://vault.azure.net --output none
                echo "##vso[task.setvariable variable=AZURE_CONFIG_DIR]$AZURE_CONFIG_DIR"

          - bash: |
              set -e
              for host in $CERTHOSTS; do
                echo "=== $host -> $VAULTNAME"
                name="ca-bundle-${host//./-}"     # naming standard: ca-bundle-<host with dashes>
                mkdir -p "$host" && cd "$host"

                # Get the server certificate
                openssl s_client -connect "$host:443" -servername "$host" </dev/null 2>/dev/null | openssl x509 -out leaf.pem
                cp leaf.pem cert.pem; : > ca-bundle.pem

                # Follow each issuer up to the root
                while [ "$(openssl x509 -in cert.pem -noout -issuer_hash)" != "$(openssl x509 -in cert.pem -noout -subject_hash)" ]; do
                  hash=$(openssl x509 -in cert.pem -noout -issuer_hash)
                  if [ -f "/etc/ssl/certs/$hash.0" ]; then
                    cp "/etc/ssl/certs/$hash.0" cert.pem
                  else
                    url=$(openssl x509 -in cert.pem -noout -text | grep -o 'CA Issuers - URI:.*' | head -1 | cut -d: -f2-)
                    curl -fsSL "$url" -o issuer
                    if ! openssl x509 -inform DER -in issuer -out cert.pem 2>/dev/null; then
                      # .p7c file with several certs: keep the matching one (none matching stops the run)
                      rm -f cert.pem p7_*.pem
                      openssl pkcs7 -inform DER -print_certs -in issuer | awk '/BEGIN CERT/{n++} n{print > ("p7_" n ".pem")}'
                      for c in p7_*.pem; do [ "$(openssl x509 -in "$c" -noout -subject_hash)" = "$hash" ] && cp "$c" cert.pem; done
                    fi
                  fi
                  cat cert.pem >> ca-bundle.pem
                done

                # Check the chain, then push to Key Vault
                openssl verify -CAfile ca-bundle.pem leaf.pem
                az keyvault secret set --vault-name "$VAULTNAME" --name "$name" \
                  --file ca-bundle.pem --content-type application/x-pem-file --output none
                echo "Pushed $name"
                cd ..
              done
            displayName: Get certs and push to Key Vault

          - bash: az keyvault secret list --vault-name "$VAULTNAME" --query "[].name" -o tsv
            displayName: List Key Vault
            condition: always()
