# Uploads each server's CA chain to Azure Key Vault, then lists them.
# Nothing is committed: the certificates are downloaded fresh on every run.

trigger: none
schedules:
  - cron: "0 6 * * 1"            # every Monday, catches certificate changes
    branches: { include: [main] }
    always: true

pool:
  name: my-selfhosted-pool       # Linux agent that can reach the hosts

variables:
  certHosts: sub.mydomain.com api.mydomain.com   # space-separated
  vaultName: my-kv

steps:
  - task: AzureCLI@2
    displayName: Upload CA bundles
    inputs:
      azureSubscription: my-service-connection   # needs Key Vault Secrets Officer
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        for host in $CERTHOSTS; do
          echo "=== $host"
          mkdir -p "$host" && cd "$host"

          # 1. Get the server's certificate
          openssl s_client -connect "$host:443" -servername "$host" </dev/null 2>/dev/null | openssl x509 -out leaf.pem
          cp leaf.pem cert.pem; : > ca-bundle.pem

          # 2. Follow each certificate's "CA Issuers" link until reaching the root (it signs itself)
          while [ "$(openssl x509 -in cert.pem -noout -subject_hash)" != "$(openssl x509 -in cert.pem -noout -issuer_hash)" ]; do
            url=$(openssl x509 -in cert.pem -noout -text | grep -o 'CA Issuers - URI:.*' | cut -d: -f2-)
            curl -fsSL "$url" | openssl x509 -inform DER -out cert.pem
            cat cert.pem >> ca-bundle.pem
          done

          # 3. Check the bundle, then upload it as ca-bundle-<host with dashes>
          openssl verify -CAfile ca-bundle.pem leaf.pem
          az keyvault secret set --vault-name "$VAULTNAME" --name "ca-bundle-${host//./-}" \
            --file ca-bundle.pem --content-type application/x-pem-file --output none
          cd ..
        done

  - task: AzureCLI@2
    displayName: List CA bundles in Key Vault
    condition: always()          # runs even if a host failed
    inputs:
      azureSubscription: my-service-connection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az keyvault secret list --vault-name "$VAULTNAME" \
          --query "[?contentType=='application/x-pem-file'].{Name:name, Updated:attributes.updated}" -o table
